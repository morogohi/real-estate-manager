# sync-data 브랜치에 임대차·관리현황·서류가 올라오면 비공개 저장소의 정리 작업을 즉시 호출
#  - 이 저장소 Secrets 에 PRIVATE_SYNC_TOKEN 이 없으면 아무것도 하지 않습니다
#    (비공개 저장소는 30분마다 스스로 가져가므로 없어도 동작은 함)
#  - 토큰: Fine-grained PAT, 대상 저장소 real-estate-management-system 만, Contents: Read and write
#  - 이 워크플로는 데이터(복호화 키·내용)를 전혀 다루지 않고 "가져가라" 신호만 보냅니다.
name: 비공개 저장소에 변경 알림

on:
  push:
    branches: [sync-data]
    paths: ['data/**']

permissions: {}

concurrency:
  group: notify-private
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: repository_dispatch 전송
        env:
          TOKEN: ${{ secrets.PRIVATE_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PRIVATE_SYNC_TOKEN 미설정 — 비공개 저장소의 30분 주기 실행에 맡깁니다."
            exit 0
          fi
          # 연속 업로드(파일·목록)를 한 번에 묶기 위해 잠시 대기 (새 push 가 오면 이 실행은 취소됨)
          sleep 45
          curl -sS -f -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/morogohi/real-estate-management-system/dispatches \
            -d '{"event_type":"public-sync"}'
          echo "비공개 저장소 정리 작업 호출 완료"
